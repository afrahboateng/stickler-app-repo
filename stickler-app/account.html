<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Stickler Properties</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e5e5e0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  @media (max-height: 900px) {
    body {
      zoom: 0.8;
    }
  }

  .phone {
    width: 390px;
    height: 844px;
    background: #000000;
    border-radius: 44px;
    padding: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #FFFFFF;
    border-radius: 32px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .status-bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    font-size: 14px;
    font-weight: 600;
    color: #000000;
    flex-shrink: 0;
  }

  .page-header {
    padding: 6px 20px 20px;
    flex-shrink: 0;
    border-bottom: 1px solid #000000;
  }

  .page-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px;
    color: #000000;
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px;
  }

  .account-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 0;
    border-bottom: 1px solid #000000;
    background: none;
    border-left: none;
    border-right: none;
    border-top: none;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
  }

  .account-row:first-child {
    border-top: none;
  }

  .account-row:active {
    background: rgba(0,0,0,0.03);
  }

  .row-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .row-title {
    font-size: 16px;
    font-weight: 600;
    color: #000000;
  }

  .row-subtitle {
    font-size: 13px;
    font-weight: 400;
    color: #000000;
    opacity: 0.5;
  }

  .row-caret {
    flex-shrink: 0;
    opacity: 0.35;
  }

  .signout-row {
    width: 100%;
    margin-top: 28px;
    padding: 16px 0;
    border: 1px solid #000000;
    border-radius: 10px;
    background: none;
    text-align: center;
    cursor: pointer;
    font-family: inherit;
  }

  .signout-row:active {
    background: rgba(0,0,0,0.03);
  }

  .signout-label {
    font-size: 15px;
    font-weight: 700;
    color: #000000;
  }

  /* PROFILE HEADER */
  .profile-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 24px 0 20px;
    border-bottom: 1px solid #000000;
    margin-bottom: 0;
  }

  .profile-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #F2F2F0;
    border: 1px solid #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    color: #000000;
    opacity: 0.5;
  }

  .profile-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .profile-name {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 18px;
    font-weight: 400;
    color: #000000;
    margin-bottom: 3px;
  }

  .profile-email {
    font-size: 12px;
    color: #000000;
    opacity: 0.45;
  }

  /* nav styles moved to app-nav.js */

  /* SUPPORT MODAL */
  .support-overlay {
    position: absolute;
    top: 44px;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 800;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    pointer-events: none;
  }

  .support-overlay.is-open {
    transform: translateY(0);
    pointer-events: auto;
  }

  .support-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
  }

  .support-card {
    position: relative;
    background: #000000;
    border-radius: 0 0 28px 28px;
    padding: 20px 24px 28px;
    height: 56%;
  }

  .support-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .support-brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .support-brand-mark {
    width: 26px;
    height: 26px;
    border-radius: 0;
    display: block;
  }

  .support-brand-mark-fallback {
    width: 26px;
    height: 26px;
    border-radius: 0;
    background: #FFFFFF;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 13px;
    font-weight: 700;
    color: #000000;
  }

  .support-brand-name {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 15px;
    color: #FFFFFF;
  }

  .support-close {
    background: none;
    border: none;
    color: #FFFFFF;
    opacity: 0.6;
    cursor: pointer;
    padding: 4px;
  }

  .support-greeting {
    font-size: 24px;
    font-weight: 600;
    color: #FFFFFF;
    line-height: 1.3;
    margin-bottom: 28px;
  }

  .support-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    margin-bottom: 12px;
    cursor: pointer;
    text-align: left;
  }

  .support-row-icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
  }

  .support-row-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .support-row-title {
    font-size: 15px;
    font-weight: 600;
    color: #FFFFFF;
  }

  .support-row-subtitle {
    font-size: 12px;
    color: #FFFFFF;
    opacity: 0.5;
  }

  .app-nav { display:flex; border-top:1px solid #000; background:#000; flex-shrink:0; }
  .app-nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 0 28px; background:none; border:none; cursor:pointer; color:#fff; opacity:0.4; text-decoration:none; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
  .app-nav-item.is-active { opacity:1; }
  .app-nav-label { font-size:9px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">

    <div class="status-bar">
      <span>9:41</span>
      <span>&#9679;&#9679;&#9679;</span>
    </div>

    <div class="page-header">
      <div class="page-title">My Account</div>
    </div>

    <div class="content">

      <!-- Profile header -->
      <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
        </div>
        <div class="profile-info">
          <div class="profile-name" id="profileName">John Smith</div>
          <div class="profile-email" id="profileEmail">john.smith@email.com</div>
        </div>
      </div>

      <!-- Menu rows -->
      <button class="account-row" onclick="window.location.href='account-details.html'">
        <div class="row-text">
          <div class="row-title">Profile</div>
          <div class="row-subtitle">Update personal information</div>
        </div>
        <svg class="row-caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>

      <button class="account-row" onclick="window.location.href='buy-box.html'">
        <div class="row-text">
          <div class="row-title">My Buy Box</div>
          <div class="row-subtitle">Set your investment criteria</div>
        </div>
        <svg class="row-caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>

      <button class="account-row" onclick="window.location.href='subscription.html'">
        <div class="row-text">
          <div class="row-title">Subscription</div>
          <div class="row-subtitle">Manage your plan</div>
        </div>
        <svg class="row-caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>

      <button class="account-row" onclick="window.location.href='payment-method.html'">
        <div class="row-text">
          <div class="row-title">Payment Method</div>
          <div class="row-subtitle">Add or update billing info</div>
        </div>
        <svg class="row-caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>

      <button class="account-row" onclick="window.location.href='vendors.html'">
        <div class="row-text">
          <div class="row-title">Vendors</div>
          <div class="row-subtitle">Trusted contractors and service providers</div>
        </div>
        <svg class="row-caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>

      <button class="account-row" onclick="window.location.href='documents.html'">
        <div class="row-text">
          <div class="row-title">My Documents</div>
          <div class="row-subtitle">Legal documents and disclaimers</div>
        </div>
        <svg class="row-caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>

      <button class="signout-row" onclick="signOut()">
        <span class="signout-label">Sign Out</span>
      </button>

    </div>


    <div class="support-overlay" id="supportOverlay">
      <div class="support-backdrop" onclick="closeSupport()"></div>
      <div class="support-card">
        <div class="support-top-row">
          <div class="support-brand">
            <img src="../stickler-assets/android-chrome-192x192.png" alt="Stickler" class="support-brand-mark" onerror="this.style.display='none'; document.getElementById('supportBrandFallback').style.display='flex';">
            <div class="support-brand-mark-fallback" id="supportBrandFallback">SP</div>
            <div class="support-brand-name">Stickler</div>
          </div>
          <button class="support-close" onclick="closeSupport()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
          </button>
        </div>

        <div class="support-greeting">Hi there 👋<br>How can we help?</div>

        <button class="support-row" onclick="window.location.href='messages.html'">
          <div class="support-row-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5H20V16H8L4 19V5Z"></path></svg>
          </div>
          <div class="support-row-text">
            <div class="support-row-title">Notifications</div>
          <div class="support-row-subtitle">Messages from the team will be shown here</div>
          </div>
        </button>

        <button class="support-row" onclick="window.location.href='ask.html'">
          <div class="support-row-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 1 1 3.2 2.4c-.8.3-1.2.8-1.2 1.6"></path><line x1="12" y1="16.5" x2="12" y2="16.5"></line></svg>
          </div>
          <div class="support-row-text">
            <div class="support-row-title">Ask a question</div>
            <div class="support-row-subtitle">AI agent and team can help</div>
          </div>
        </button>
      </div>
    </div>


    <nav class="app-nav">
  <a class="app-nav-item" href="marketplace-map.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span class="app-nav-label">Search</span></a>
  <a class="app-nav-item" href="favorites.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span class="app-nav-label">Favorites</span></a>
  <a class="app-nav-item" href="offers.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path><path d="M7 8h10M7 12h6"></path></svg><span class="app-nav-label">Offers</span></a>
  <a class="app-nav-item" href="messages.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5H20V16H8L4 19V5Z"></path></svg><span class="app-nav-label">Messages</span></a>
  <a class="app-nav-item is-active" href="account.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path></svg><span class="app-nav-label">Profile</span></a>
</nav>
  </div>
</div>

<script src="listings.js"></script>
<script>
  // Populate profile from stored session
  var session = localStorage.getItem('stickler_session');
  if (session) {
    try {
      var data = JSON.parse(session);
      if (data.user) {
        if (data.user.name) document.getElementById('profileName').textContent = data.user.name;
        if (data.user.email) document.getElementById('profileEmail').textContent = data.user.email;
        if (data.user.avatar) {
          var avatarEl = document.getElementById('profileAvatar');
          avatarEl.innerHTML = '<img src="' + data.user.avatar + '" alt="Profile">';
        }
      }
    } catch(e) {}
  }

  function signOut() {
    localStorage.removeItem('stickler_session');
    window.location.href = 'login.html';
  }

  function openSupport() {
    document.getElementById('supportOverlay').classList.add('is-open');
  }
  function closeSupport() {
    document.getElementById('supportOverlay').classList.remove('is-open');
  }
</script>

</body>
</html>
