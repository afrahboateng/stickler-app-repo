<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Stickler Properties</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e5e5e0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  @media (max-height: 900px) {
    body { zoom: 0.8; }
  }

  .phone {
    width: 390px;
    height: 844px;
    background: #000000;
    border-radius: 44px;
    padding: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #000000;
    border-radius: 32px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .status-bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    font-size: 14px;
    font-weight: 600;
    color: #FFFFFF;
    flex-shrink: 0;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px 60px;
  }

  /* Logo / wordmark */
  .logo-wrap {
    margin-bottom: 48px;
    text-align: center;
  }

  .logo-box {
    display: inline-block;
    border: 1px solid #FFFFFF;
    padding: 10px 24px;
    margin-bottom: 16px;
  }

  .logo-text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 22px;
    font-weight: 400;
    color: #FFFFFF;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .logo-tagline {
    font-size: 12px;
    font-weight: 400;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* Headline */
  .headline {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 28px;
    font-weight: 400;
    color: #FFFFFF;
    text-align: center;
    line-height: 1.25;
    margin-bottom: 12px;
  }

  .subline {
    font-size: 14px;
    font-weight: 300;
    color: rgba(255,255,255,0.45);
    text-align: center;
    line-height: 1.6;
    margin-bottom: 48px;
    max-width: 260px;
  }

  /* Google button */
  .google-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #FFFFFF;
    color: #000000;
    border: none;
    border-radius: 10px;
    padding: 16px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
    margin-bottom: 16px;
  }
  .google-btn:active { opacity: 0.85; }
  .google-btn:disabled { opacity: 0.5; cursor: default; }

  .google-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin-bottom: 16px;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.12);
  }

  .divider-text {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* Coming soon placeholder for future auth */
  .coming-soon-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: transparent;
    color: rgba(255,255,255,0.3);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 16px 24px;
    font-size: 15px;
    font-weight: 500;
    cursor: default;
    font-family: inherit;
    margin-bottom: 12px;
  }

  /* Error message */
  .error-msg {
    display: none;
    background: rgba(255,60,60,0.12);
    border: 1px solid rgba(255,60,60,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: #FF6B6B;
    text-align: center;
    margin-top: 16px;
    line-height: 1.5;
    width: 100%;
  }

  .error-msg.visible { display: block; }

  /* Loading state */
  .loading-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    border-radius: 32px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 100;
  }

  .loading-overlay.visible { display: flex; }

  .spinner {
    width: 36px;
    height: 36px;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: #FFFFFF;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
  }

  /* Footer */
  .login-footer {
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    text-align: center;
    line-height: 1.6;
    margin-top: 32px;
    max-width: 260px;
  }

  /* DEV SKIP BUTTON — comment out before App Store submission */
  .dev-skip {
    position: absolute;
    top: 52px;
    right: 20px;
    background: rgba(255,255,0,0.15);
    border: 1px solid rgba(255,255,0,0.3);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,0,0.7);
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">

    <div class="status-bar">
      <span>9:41</span>
      <span>&#9679;&#9679;&#9679;</span>
    </div>

    <!-- DEV ONLY: skip login during testing — comment out before launch -->
    <button class="dev-skip" onclick="skipLogin()" title="Dev skip">DEV ⚡</button>

    <div class="content">

      <div class="logo-wrap">
        <div class="logo-box">
          <div class="logo-text">Stickler</div>
        </div>
        <div class="logo-tagline">Access Before the Market.</div>
      </div>

      <div class="headline">Welcome back</div>
      <div class="subline">Sign in to access exclusive off-market investment opportunities.</div>

      <button class="google-btn" id="googleBtn" onclick="signInWithGoogle()">
        <!-- Google logo SVG -->
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">More options coming soon</div>
        <div class="divider-line"></div>
      </div>

      <button class="coming-soon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        More sign-in options coming soon
      </button>

      <div class="error-msg" id="errorMsg"></div>

      <div class="login-footer">
        By continuing, you agree to Stickler's Terms of Use and Privacy Policy.
      </div>

    </div>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">Signing you in...</div>
    </div>

  </div>
</div>

<script>
  var SUPABASE_URL = 'https://pjqsceuvwswgtzjinlvm.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_R_sjrdmjaLBSJ5RUubIkcA_RqjqmfDr';

  // Check if already logged in — if so skip straight to onboarding
  function checkSession() {
    var session = localStorage.getItem('stickler_session');
    if (session) {
      window.location.href = 'onboarding.html';
    }
  }
  checkSession();

  // Handle OAuth callback — Supabase redirects back here with tokens in the URL hash
  function handleAuthCallback() {
    var hash = window.location.hash;
    if (hash && hash.includes('access_token')) {
      var params = new URLSearchParams(hash.replace('#', '?'));
      var accessToken = params.get('access_token');
      var refreshToken = params.get('refresh_token');
      if (accessToken) {
        localStorage.setItem('stickler_session', JSON.stringify({
          access_token: accessToken,
          refresh_token: refreshToken,
          timestamp: Date.now()
        }));
        // Clean up URL and proceed
        window.history.replaceState(null, '', window.location.pathname);
        window.location.href = 'onboarding.html';
      }
    }
  }
  handleAuthCallback();

  function signInWithGoogle() {
    var btn = document.getElementById('googleBtn');
    var overlay = document.getElementById('loadingOverlay');
    btn.disabled = true;
    overlay.classList.add('visible');

    var redirectTo = window.location.origin + window.location.pathname;

    var url = SUPABASE_URL + '/auth/v1/authorize'
      + '?provider=google'
      + '&redirect_to=' + encodeURIComponent(redirectTo);

    window.location.href = url;
  }

  function showError(msg) {
    var el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
    document.getElementById('loadingOverlay').classList.remove('visible');
    document.getElementById('googleBtn').disabled = false;
  }

  // DEV ONLY: skip login during testing
  function skipLogin() {
    localStorage.setItem('stickler_session', JSON.stringify({
      access_token: 'dev_skip',
      timestamp: Date.now()
    }));
    window.location.href = 'onboarding.html';
  }
</script>

</body>
</html>
