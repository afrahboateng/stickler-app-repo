<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace — Stickler Properties</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e5e5e0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  @media (max-height: 900px) {
    body {
      zoom: 0.8;
    }
  }

  .phone {
    width: 390px;
    height: 844px;
    background: #000000;
    border-radius: 44px;
    padding: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .screen {
    width: 100%;
    height: 100%;
    background: #FFFFFF;
    border-radius: 32px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .status-bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    font-size: 14px;
    font-weight: 600;
    color: #000000;
    flex-shrink: 0;
  }

  .header {
    padding: 10px 20px 14px;
    flex-shrink: 0;
    border-bottom: 1px solid #000000;
  }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #F2F2F0;
    border: 1px solid #000000;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
  }

  .search-bar svg {
    flex-shrink: 0;
    opacity: 0.5;
  }

  .search-bar input {
    border: none;
    outline: none;
    background: none;
    font-size: 14px;
    width: 100%;
    color: #000000;
  }

  .search-bar input::placeholder {
    color: rgba(0,0,0,0.4);
  }

  .filter-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }

  .sort-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid #000000;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: #000000;
    cursor: pointer;
  }

  .sort-btn svg {
    flex-shrink: 0;
  }

  .results-count {
    font-size: 12px;
    font-weight: 600;
    color: #000000;
    opacity: 0.5;
  }

  .sort-menu {
    position: absolute;
    top: 42px;
    left: 0;
    background: #FFFFFF;
    border: 1px solid #000000;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    z-index: 50;
    display: none;
    overflow: hidden;
    min-width: 180px;
  }

  .sort-menu.is-open {
    display: block;
  }

  .sort-option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 500;
    color: #000000;
    background: none;
    border: none;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    cursor: pointer;
  }

  .sort-option:last-child {
    border-bottom: none;
  }

  .sort-option:hover,
  .sort-option.is-active {
    background: rgba(0,0,0,0.05);
  }

  .list-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
  }

  .list-content {
    height: 100%;
    overflow-y: auto;
    padding: 16px 20px 24px;
  }

  .listing-card {
    border: 1px solid #000000;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 16px;
    cursor: pointer;
  }

  .listing-photo {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
  }

  .listing-info {
    padding: 14px 16px;
  }

  .listing-price {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 22px;
    color: #000000;
    margin-bottom: 4px;
  }

  .listing-address {
    font-size: 13px;
    color: #000000;
    opacity: 0.6;
    margin-bottom: 8px;
  }

  .listing-stats {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #000000;
    opacity: 0.5;
  }

  .view-map-btn {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #000000;
    color: #FFFFFF;
    border: none;
    border-radius: 22px;
    padding: 11px 20px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }

  .view-map-btn svg {
    flex-shrink: 0;
  }

  .footer-nav {
    display: flex;
    border-top: 1px solid #000000;
    background: #000000;
    flex-shrink: 0;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 10px 0 22px;
    background: none;
    border: none;
    cursor: pointer;
    color: #FFFFFF;
    opacity: 0.4;
  }

  .nav-item.is-active {
    opacity: 1;
  }

  .nav-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* LISTING DETAIL MODAL */
  .detail-overlay {
    position: absolute;
    top: 44px;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 900;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    pointer-events: none;
    display: flex;
    align-items: flex-end;
  }

  .detail-overlay.is-open {
    transform: translateY(0);
    pointer-events: auto;
  }

  .detail-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
  }

  .detail-card {
    position: relative;
    background: #FFFFFF;
    border-radius: 20px 20px 0 0;
    width: 100%;
    height: 92%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .detail-photo-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .detail-photo {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
  }

  .detail-close {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    color: #000000;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .detail-status-badge {
    position: absolute;
    top: 14px;
    left: 56px;
    background: #000000;
    color: #FFFFFF;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 4px;
  }

  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px 8px;
    background: #F5F5F5;
  }

  .detail-price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
  }

  .detail-price {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 28px;
    font-weight: 400;
    color: #000000;
  }

  .detail-arv {
    font-size: 14px;
    font-weight: 600;
    color: #000000;
  }

  .detail-address {
    font-size: 14px;
    color: #000000;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .detail-stats {
    font-size: 13px;
    color: #000000;
    opacity: 0.7;
    margin-bottom: 12px;
  }

  .detail-gross-margin {
    font-size: 14px;
    font-weight: 600;
    color: #000000;
    margin-bottom: 14px;
  }

  .detail-specs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }

  .detail-spec-card {
    background: #FFFFFF;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 8px;
    padding: 12px 14px;
  }

  .detail-spec-label {
    font-size: 11px;
    color: #000000;
    opacity: 0.45;
    margin-bottom: 4px;
  }

  .detail-spec-value {
    font-size: 14px;
    font-weight: 700;
    color: #000000;
  }

  .detail-overview-title {
    font-size: 18px;
    font-weight: 700;
    color: #000000;
    margin-bottom: 10px;
  }

  .detail-overview-text {
    font-size: 13px;
    color: #000000;
    opacity: 0.65;
    line-height: 1.6;
    margin-bottom: 12px;
  }

  .detail-footer {
    flex-shrink: 0;
    padding: 12px 20px 20px;
    border-top: 1px solid rgba(0,0,0,0.08);
    display: flex;
    gap: 10px;
    background: #FFFFFF;
  }

  .showing-times-btn {
    width: 100%;
    background: #FFFFFF;
    border: 1px solid #000000;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 14px;
    font-weight: 700;
    color: #000000;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .showing-times-panel {
    display: none;
    gap: 8px;
    margin-top: 12px;
  }

  .showing-times-panel.is-open {
    display: flex;
  }

  .showing-time-option {
    flex: 1;
    background: #F2F2F0;
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 8px;
    padding: 10px 6px;
    font-size: 12px;
    font-weight: 600;
    color: #000000;
    text-align: center;
    cursor: pointer;
  }

  .showing-time-option.is-selected {
    background: #000000;
    color: #FFFFFF;
    border-color: #000000;
  }

  .get-funding-btn {
    flex: 1;
    background: #000000;
    color: #FFFFFF;
    border: none;
    border-radius: 10px;
    padding: 16px 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  .make-offer-btn {
    flex: 1;
    background: #000000;
    color: #FFFFFF;
    border: none;
    border-radius: 10px;
    padding: 16px 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  

  /* SUPPORT MODAL */
  .support-overlay {
    position: absolute;
    top: 44px;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 800;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    pointer-events: none;
  }

  .support-overlay.is-open {
    transform: translateY(0);
    pointer-events: auto;
  }

  .support-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
  }

  .support-card {
    position: relative;
    background: #000000;
    border-radius: 0 0 28px 28px;
    padding: 20px 24px 28px;
    height: 56%;
  }

  .support-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .support-brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .support-brand-mark {
    width: 26px;
    height: 26px;
    border-radius: 0;
    display: block;
  }

  .support-brand-mark-fallback {
    width: 26px;
    height: 26px;
    border-radius: 0;
    background: #FFFFFF;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 13px;
    font-weight: 700;
    color: #000000;
  }

  .support-brand-name {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 15px;
    color: #FFFFFF;
  }

  .support-close {
    background: none;
    border: none;
    color: #FFFFFF;
    opacity: 0.6;
    cursor: pointer;
    padding: 4px;
  }

  .support-greeting {
    font-size: 24px;
    font-weight: 600;
    color: #FFFFFF;
    line-height: 1.3;
    margin-bottom: 28px;
  }

  .support-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    margin-bottom: 12px;
    cursor: pointer;
    text-align: left;
  }

  .support-row-icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
  }

  .support-row-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .support-row-title {
    font-size: 15px;
    font-weight: 600;
    color: #FFFFFF;
  }

  .support-row-subtitle {
    font-size: 12px;
    color: #FFFFFF;
    opacity: 0.5;
  }

  .agent-section { margin-top: 16px; padding: 16px 16px 8px; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; }
  .agent-section-label { font-size: 17px; font-weight: 700; color: #000; margin-bottom: 16px; }
  .agent-card-inner { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 16px; }
  .agent-photo { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(0,0,0,0.08); margin-bottom: 10px; background: #E0E0E0; display: block; }
  .agent-initials { width: 72px; height: 72px; border-radius: 50%; background: #000; color: #fff; display: none; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .agent-name { font-size: 15px; color: rgba(0,0,0,0.5); margin-bottom: 2px; }
  .agent-company { font-size: 17px; font-weight: 700; color: #000; margin-bottom: 10px; }
  .agent-stars { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .star-filled { color: #F59E0B; font-size: 18px; line-height: 1; }
  .star-empty { color: #D1D5DB; font-size: 18px; line-height: 1; }
  .agent-rating-num { font-size: 14px; font-weight: 600; color: #000; margin-left: 4px; }
  .agent-reviews-text { font-size: 14px; color: #000; }
  .agent-btn { width: 100%; padding: 14px 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 8px; border: 1px solid #000; background: #fff; color: #000; display: block; }
  .agent-btn:last-child { margin-bottom: 0; }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">

    <div class="status-bar">
      <span>9:41</span>
      <span>&#9679;&#9679;&#9679;</span>
    </div>

    <div class="header">
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="citySearch" type="text" placeholder="Search city, e.g. Atlanta, GA">
      </div>

      <div class="filter-row">
        <button class="sort-btn" id="sortBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M10 18h4"></path></svg>
          <span id="sortLabel">Sort by price</span>
        </button>
        <div class="results-count" id="resultsCount">0 results</div>

        <div class="sort-menu" id="sortMenu">
          <button class="sort-option" data-sort="price-asc">Lowest price</button>
          <button class="sort-option" data-sort="price-desc">Highest price</button>
          <button class="sort-option" data-sort="beds">Beds</button>
          <button class="sort-option" data-sort="baths">Bath</button>
          <button class="sort-option" data-sort="sqft">Square feet</button>
        </div>
      </div>
    </div>

    <div class="list-wrap">
      <div class="list-content" id="listContent"></div>

      <button class="view-map-btn" id="viewMapBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"></path><line x1="9" y1="7" x2="9" y2="20"></line><line x1="15" y1="4" x2="15" y2="17"></line></svg>
        View map
      </button>
    </div>

    <div class="detail-overlay" id="detailOverlay">
      <div class="detail-backdrop" onclick="closeDetail()"></div>
      <div class="detail-card">
        <div class="detail-photo-wrap">
          <img src="" alt="" class="detail-photo" id="detailPhoto">
          <button class="detail-close" onclick="closeDetail()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
          </button>
          <div class="detail-status-badge" id="detailStatus">For Sale</div>
        </div>
        <div class="detail-body">
          <div class="detail-price-row">
            <div class="detail-price" id="detailPrice"></div>
            <div class="detail-arv" id="detailArv"></div>
          </div>
          <div class="detail-address" id="detailAddress"></div>
          <div class="detail-stats" id="detailStats"></div>
          <div class="detail-gross-margin" id="detailGrossMargin"></div>
          <div class="detail-specs-grid" id="detailSpecsGrid"></div>
          <div class="detail-overview-title">Overview</div>
          <div class="detail-overview-text" id="detailOverview"></div>
          <button class="showing-times-btn" id="showingTimesBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            Showing Times
          </button>
          <div class="showing-times-panel" id="showingTimesPanel"></div>
          <div class="agent-section" id="agentSection" style="display:none">
            <div class="agent-section-label">Account manager</div>
            <div class="agent-card-inner">
              <img class="agent-photo" id="agentPhoto" src="" alt=""
                onerror="this.style.display='none';document.getElementById('agentInitialsEl').style.display='flex'">
              <div class="agent-initials" id="agentInitialsEl" style="display:none"></div>
              <div class="agent-name" id="agentName"></div>
              <div class="agent-company">Stickler Properties</div>
              <div class="agent-stars" id="agentStars"></div>
            </div>
            <button class="agent-btn" id="agentInquiryBtn">Contact</button>
          </div>
          </div>
        <div class="detail-footer">
          <button class="get-funding-btn" onclick="window.open('https://stickler-capital.netlify.app', '_blank')">Get Funding</button>
          <button class="make-offer-btn" onclick="makeOffer(currentOfferIdx)">Make an Offer</button>
        </div>
      </div>
    </div>

    <div id="appNavMount"></div>

    <div class="support-overlay" id="supportOverlay">
      <div class="support-backdrop" onclick="closeSupport()"></div>
      <div class="support-card">
        <div class="support-top-row">
          <div class="support-brand">
            <img src="../stickler-assets/android-chrome-192x192.png" alt="Stickler" class="support-brand-mark" onerror="this.style.display='none'; document.getElementById('supportBrandFallback').style.display='flex';">
            <div class="support-brand-mark-fallback" id="supportBrandFallback">SP</div>
            <div class="support-brand-name">Stickler</div>
          </div>
          <button class="support-close" onclick="closeSupport()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
          </button>
        </div>

        <div class="support-greeting">Hi there 👋<br>How can we help?</div>

        <button class="support-row" onclick="window.location.href='messages.html'">
          <div class="support-row-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5H20V16H8L4 19V5Z"></path></svg>
          </div>
          <div class="support-row-text">
            <div class="support-row-title">Notifications</div>
          <div class="support-row-subtitle">Messages from the team will be shown here</div>
          </div>
        </button>

        <button class="support-row" onclick="window.location.href='ask.html'">
          <div class="support-row-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 1 1 3.2 2.4c-.8.3-1.2.8-1.2 1.6"></path><line x1="12" y1="16.5" x2="12" y2="16.5"></line></svg>
          </div>
          <div class="support-row-text">
            <div class="support-row-title">Ask a question</div>
            <div class="support-row-subtitle">AI agent and team can help</div>
          </div>
        </button>
      </div>
    </div>

  </div>
</div>

<script src="listings.js"></script>
<script src="supabase-client.js"></script>
<script>
  var currentCity = resolveCurrentCity("atlanta");
  setLastMarketplaceView("list");
  var currentSort = null;
  var _allListings = []; // cache from Supabase

  var searchInput = document.getElementById('citySearch');
  var listContent = document.getElementById('listContent');
  var resultsCount = document.getElementById('resultsCount');
  var sortBtn = document.getElementById('sortBtn');
  var sortLabel = document.getElementById('sortLabel');
  var sortMenu = document.getElementById('sortMenu');

  function sortListings(listings) {
    var sorted = listings.slice();
    if (currentSort === 'price-asc') sorted.sort(function(a, b) { return a.price - b.price; });
    else if (currentSort === 'price-desc') sorted.sort(function(a, b) { return b.price - a.price; });
    else if (currentSort === 'beds') sorted.sort(function(a, b) { return b.beds - a.beds; });
    else if (currentSort === 'baths') sorted.sort(function(a, b) { return b.baths - a.baths; });
    else if (currentSort === 'sqft') sorted.sort(function(a, b) { return b.sqft - a.sqft; });
    return sorted;
  }

  var currentListings = [];

  function render() {
    currentListings = sortListings(_allListings);
    resultsCount.textContent = currentListings.length + (currentListings.length === 1 ? ' result' : ' results') + ' in ' + CITIES[currentCity].label;

    listContent.innerHTML = currentListings.map(function(p, idx) {
      return '' +
        '<div class="listing-card" onclick="openDetail(' + idx + ')">' +
          '<img src="' + p.photo + '" class="listing-photo" alt="' + p.address + '">' +
          '<div class="listing-info">' +
            '<div class="listing-price">' + formatPriceK(p.price) + '</div>' +
            '<div class="listing-address">' + p.address + '</div>' +
            '<div class="listing-stats">' + formatStats(p) + '</div>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  function formatDollars(n) {
    if (!n) return '--';
    return '$' + n.toLocaleString();
  }

  var currentOfferIdx = 0;
  function openDetail(idx) {
    currentOfferIdx = idx;
    var p = currentListings[idx];
    document.getElementById('detailPhoto').src = p.photo;
    document.getElementById('detailPhoto').alt = p.address;
    document.getElementById('detailPrice').textContent = formatDollars(p.price);
    document.getElementById('detailArv').textContent = p.arv ? '(ARV: ' + formatDollars(p.arv) + ')' : '';
    document.getElementById('detailAddress').innerHTML =
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"></path><circle cx="12" cy="9" r="2.5"></circle></svg> ' + p.address;
    document.getElementById('detailStats').textContent = p.beds + ' Beds  ·  ' + p.baths + ' Baths  ·  ' + p.sqft.toLocaleString() + ' Sq.Ft.';
    document.getElementById('detailGrossMargin').textContent = p.gross_margin ? 'Gross margin: ' + formatDollars(p.gross_margin) : '';
    document.getElementById('detailStatus').textContent = p.status || 'For Sale';
    var specs = [
      { label: 'Type', value: p.property_type || 'Single-Family' },
      { label: 'Parking', value: p.parking || 'Street' },
      { label: 'Built in', value: p.year_built || '--' },
      { label: 'Lot size', value: p.lot_size || '--' }
    ];
    document.getElementById('detailSpecsGrid').innerHTML = specs.map(function(s) {
      return '<div class="detail-spec-card"><div class="detail-spec-label">' + s.label + '</div><div class="detail-spec-value">' + s.value + '</div></div>';
    }).join('');
    var overviewParts = [];
    if (p.overview) {
      overviewParts.push(p.overview);
    } else {
      overviewParts.push('Asking Price: ' + formatDollars(p.price));
      if (p.arv) overviewParts.push('ARV: ' + formatDollars(p.arv));
      if (p.market_rent) overviewParts.push('Market Rent: ' + formatDollars(p.market_rent));
    }
    document.getElementById('detailOverview').textContent = overviewParts.join('  ·  ');

    // Agent card
    if (p.agent_name) {
      var agentPhoto = document.getElementById('agentPhoto');
      var agentInitials = document.getElementById('agentInitialsEl');
      agentPhoto.src = p.agent_photo_url || '';
      agentPhoto.style.display = 'block';
      agentInitials.style.display = 'none';
      agentInitials.textContent = p.agent_name.split(' ').map(function(n){return n[0];}).join('');
      document.getElementById('agentName').textContent = p.agent_name;

      // Stars: filled circles then empty, then rating number then "X Reviews"
      var rating = p.agent_rating || 0;
      var reviews = p.agent_reviews || 0;
      var filled = Math.round(rating);
      var starsHtml = '';
      for (var s = 1; s <= 5; s++) {
        starsHtml += '<span class="' + (s <= filled ? 'star-filled' : 'star-empty') + '">&#9733;</span>';
      }
      starsHtml += '<span class="agent-rating-num">' + rating.toFixed(1) + '</span>';
      starsHtml += '<span class="agent-reviews-text">&nbsp;' + reviews + ' Reviews</span>';
      document.getElementById('agentStars').innerHTML = starsHtml;

      document.getElementById('agentInquiryBtn').onclick = function() {
        window.location.href = 'messages.html';
      };
      document.getElementById('agentSection').style.display = 'block';
    } else {
      document.getElementById('agentSection').style.display = 'none';
    }
    document.getElementById('showingTimesPanel').classList.remove('is-open');
    document.getElementById('detailOverlay').classList.add('is-open');
  }
  function makeOffer(idx) {
    var p = currentListings[idx];
    window._offerPrice = p.price;
    window._offerArv = p.arv;
    window._offerAddress = p.address;
    window._offerPhoto = p.photo;
    window.location.href = 'make-offer.html';
  }
    function closeDetail() {
    document.getElementById('detailOverlay').classList.remove('is-open');
  }

  var showingTimesPanel = document.getElementById('showingTimesPanel');
  showingTimesPanel.innerHTML = getNextFridays(3).map(function(d, i) {
    return '<div class="showing-time-option" data-idx="' + i + '">' + formatShowingDate(d) + '</div>';
  }).join('');

  document.getElementById('showingTimesBtn').addEventListener('click', function() {
    showingTimesPanel.classList.toggle('is-open');
  });

  showingTimesPanel.addEventListener('click', function(e) {
    var opt = e.target.closest('.showing-time-option');
    if (!opt) return;
    showingTimesPanel.querySelectorAll('.showing-time-option').forEach(function(el) {
      el.classList.remove('is-selected');
    });
    opt.classList.add('is-selected');
  });

  // Load from Supabase on startup
  function loadCity(cityKey) {
    listContent.innerHTML = '<div style="padding:40px;text-align:center;opacity:0.4;font-size:14px;">Loading listings...</div>';
    fetchListingsForCity(cityKey).then(function(listings) {
      _allListings = listings;
      render();
    }).catch(function(err) {
      console.error(err);
      // Fall back to local data if Supabase fails
      _allListings = [];
      render();
    });
  }
  loadCity(currentCity);

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var match = resolveCityFromQuery(searchInput.value);
      if (match) {
        currentCity = match;
        updateCurrentCity(currentCity);
        render();
      }
    }
  });

  sortBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    sortMenu.classList.toggle('is-open');
  });

  document.addEventListener('click', function() {
    sortMenu.classList.remove('is-open');
  });

  document.querySelectorAll('.sort-option').forEach(function(opt) {
    opt.addEventListener('click', function(e) {
      e.stopPropagation();
      currentSort = opt.getAttribute('data-sort');
      sortLabel.textContent = opt.textContent;
      document.querySelectorAll('.sort-option').forEach(function(o) { o.classList.remove('is-active'); });
      opt.classList.add('is-active');
      sortMenu.classList.remove('is-open');
      render();
    });
  });

  document.getElementById('viewMapBtn').addEventListener('click', function() {
    window.location.href = 'marketplace-map.html?city=' + currentCity;
  });

  function openSupport() {
    document.getElementById('supportOverlay').classList.add('is-open');
  }
  function closeSupport() {
    document.getElementById('supportOverlay').classList.remove('is-open');
  }
</script>

<script src="app-nav.js"></script>
</body>
</html>
