<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Method — Stickler</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #e5e5e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
  @media (max-height: 900px) { body { zoom: 0.8; } }
  .phone { width: 390px; height: 844px; background: #000; border-radius: 44px; padding: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .screen { width: 100%; height: 100%; background: #FFFFFF; border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; }
  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; font-weight: 600; color: #000; flex-shrink: 0; }
  .page-header { display: flex; align-items: center; justify-content: center; padding: 0 20px; height: 52px; background: #FFFFFF; border-bottom: 1px solid rgba(0,0,0,0.08); flex-shrink: 0; position: relative; }
  .back-btn { position: absolute; left: 16px; background: none; border: none; cursor: pointer; font-size: 22px; color: #000; padding: 4px 8px; }
  .page-title { font-size: 17px; font-weight: 700; color: #000; }
  .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; }

  .empty-icon {
    width: 140px;
    height: 140px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty-title {
    font-size: 20px;
    font-weight: 700;
    color: #000;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 32px;
    max-width: 220px;
  }

  .add-btn {
    width: 100%;
    background: #2B4EFF;
    color: #FFFFFF;
    border: none;
    border-radius: 10px;
    padding: 17px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .app-nav { display:flex; border-top:1px solid #000; background:#000; flex-shrink:0; }
  .app-nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 0 28px; background:none; border:none; cursor:pointer; color:#fff; opacity:0.4; text-decoration:none; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
  .app-nav-item.is-active { opacity:1; }
  .app-nav-label { font-size:9px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">

    <div class="status-bar"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>

    <div class="page-header">
      <button class="back-btn" onclick="history.back()">&#8249;</button>
      <div class="page-title">Payment Method</div>
    </div>

    <div class="content">
      <!-- Card + coin illustration in blue -->
      <div class="empty-icon">
        <svg width="140" height="110" viewBox="0 0 140 110" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Sparkle top left -->
          <path d="M28 18 L30 12 L32 18 L38 20 L32 22 L30 28 L28 22 L22 20 Z" fill="#2B4EFF" opacity="0.3"/>
          <!-- Sparkle bottom right -->
          <path d="M112 72 L114 66 L116 72 L122 74 L116 76 L114 82 L112 76 L106 74 Z" fill="#2B4EFF" opacity="0.3"/>
          <!-- Card body -->
          <rect x="20" y="35" width="80" height="52" rx="8" fill="#C7D3FF" stroke="#2B4EFF" stroke-width="2"/>
          <!-- Card chip -->
          <rect x="30" y="48" width="18" height="14" rx="3" fill="#2B4EFF" opacity="0.4"/>
          <!-- Card lines -->
          <rect x="30" y="70" width="40" height="4" rx="2" fill="#2B4EFF" opacity="0.3"/>
          <rect x="30" y="78" width="28" height="4" rx="2" fill="#2B4EFF" opacity="0.2"/>
          <!-- Coin -->
          <circle cx="100" cy="52" r="26" fill="#C7D3FF" stroke="#2B4EFF" stroke-width="2"/>
          <circle cx="100" cy="52" r="20" fill="#A5B8FF" opacity="0.5"/>
          <text x="100" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#2B4EFF">IC</text>
        </svg>
      </div>

      <div class="empty-title">You don't have any saved payment methods yet</div>

      <button class="add-btn">Add payment method</button>
    </div>

    <nav class="app-nav">
      <a class="app-nav-item" href="marketplace-map.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span class="app-nav-label">Search</span></a>
      <a class="app-nav-item" href="favorites.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span class="app-nav-label">Favorites</span></a>
      <a class="app-nav-item" href="offers.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path><path d="M7 8h10M7 12h6"></path></svg><span class="app-nav-label">Offers</span></a>
      <a class="app-nav-item" href="messages.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5H20V16H8L4 19V5Z"></path></svg><span class="app-nav-label">Messages</span></a>
      <a class="app-nav-item is-active" href="account.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path></svg><span class="app-nav-label">Profile</span></a>
    </nav>

  </div>
</div>
</body>
</html>
